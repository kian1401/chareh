name: chareh
description: "چاره — پلتفرم خدمات خانگی (معادل عملکردی Urban Company) | مشتری + سرویس‌دهنده + ادمین"
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: any
  provider: ^6.1.2
  go_router: any
  # پین عمدی: نسخه‌ی ۹ به material_ui مهاجرت کرده و با ThemeData کلاسیک ناسازگار است
  google_fonts: 6.3.3

  # 🗺️ نقشهٔ تعاملی OpenStreetMap برای انتخاب آدرس
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # ── Firebase (فقط وقتی BackendConfig.useMock=false شود در زمان اجرا استفاده می‌شود) ──
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  cloud_functions: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/categories/
