name: 📱 Build APKs (Customer + Provider)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release --no-tree-shake-icons --flavor customer -t lib/main_customer.dart
      - run: flutter build apk --release --no-tree-shake-icons --flavor provider -t lib/main_provider.dart
      - run: flutter build web --release --no-tree-shake-icons --no-wasm-dry-run
      - run: |
          cp build/app/outputs/flutter-apk/app-customer-release.apk Chareh-Customer.apk
          cp build/app/outputs/flutter-apk/app-provider-release.apk Chareh-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chareh-apks
          path:
            Chareh-Customer.apk
            Chareh-Pro.apk
      - name: Release assets (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files:
            Chareh-Customer.apk
            Chareh-Pro.apk
