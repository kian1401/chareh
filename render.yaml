# 🔗 Render Blueprint — استقرار رایگان چاره
# راهنما: deploy/DEPLOY.md
services:
  - type: web
    name: chareh-web
    runtime: static
    buildCommand: bash deploy/render_build.sh
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
